name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # CausalFrames is unregistered. Julia >= 1.11 reads its URL from
      # [sources] in Project.toml; 1.10 ignores [sources], so develop it first.
      - name: Develop CausalFrames (Julia 1.10)
        if: matrix.version == '1.10'
        run: julia --project -e 'using Pkg; Pkg.develop(url = "https://github.com/farrellm/CausalFrames.jl")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # JET 0.10+ drops Julia 1.10, so the floor job lets the resolver pick
          # the newest 1.10-compatible JET rather than forcing the latest.
          force_latest_compatible_version: ${{ matrix.version == '1.10' && 'false' || 'auto' }}
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # let the action post reviewdog suggestions on PRs
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-format@v4
        with:
          # Track JuliaFormatter v2, as CausalFrames does.
          version: '2'
